# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# h2: isolated headless profile used as the Harness² DSH substrate.
# The runner sets, per rollout:
#   DSH_AGENTS_HOME   staged harness dir; its AGENTS.md is the always-on text
#   H2_SKILLS_DIR     staged skills root (the only skill root scanned)
#   H2_PROVIDER / H2_MODEL   executor model override
#   DSH_PERMISSION_MODE      sandbox mode (default workspace-write)
- id: credentials
  name: "@deepseek-ai/dsh-credentials-local"
  disabled: false
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: !!js process.env.H2_PROVIDER ?? 'opencode-go'
    model: !!js process.env.H2_MODEL ?? 'deepseek-v4-pro'
    reasoningEffort: !!js process.env.H2_EFFORT || 'high'
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
- id: skill-filesystem
  name: "@deepseek-ai/dsh-skill-filesystem"
  config:
    includeDefaultRoots: false
    customSkillDirs: !!js "process.env.H2_SKILLS_DIR ? [process.env.H2_SKILLS_DIR] : []"
    watch: false
